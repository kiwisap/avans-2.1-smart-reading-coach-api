# Render Blueprint: describes the API service so it can be created (and recreated) from code.
# Free plan: the service sleeps after 15 minutes without traffic and needs about a minute to wake up.
# PostgreSQL lives on Neon and MongoDB on Atlas (both have a permanent free plan), because the
# free PostgreSQL of Render is deleted after 30 days.
services:
    - type: web
      runtime: docker
      name: smart-reading-coach-api
      plan: free
      dockerfilePath: ./Dockerfile
      healthCheckPath: /api/health
      # The GitHub Actions pipeline starts every deploy (deploy hook), after the checks are green.
      autoDeployTrigger: off
      envVars:
          - key: NODE_ENV
            value: production
          - key: MONGO_DB
            value: smart_reading_coach_files
          - key: JWT_SECRET
            generateValue: true
          # Asked for in the Render dashboard when the blueprint is created:
          - key: POSTGRES_URL # Neon connection string, ends with ?sslmode=require
            sync: false
          - key: MONGO_URL # Atlas connection string (mongodb+srv://...)
            sync: false
          - key: CORS_ORIGIN # address of the website, for example https://smart-reading-coach.onrender.com
            sync: false
          # The AI service is a separate Render service (repo smart-reading-coach-ai). Leave
          # AI_SERVICE_URL empty to use the rule based advice only.
          - key: AI_SERVICE_URL # for example https://smart-reading-coach-ai.onrender.com
            sync: false
          - key: AI_API_KEY # the same value as AI_API_KEY of the AI service
            sync: false
          # A sleeping AI service needs time to wake up; until then the rules give the advice.
          - key: AI_TIMEOUT_MS
            value: '5000'
          # Mail over SMTP, for example Brevo: smtps://<login>:<smtp key>@smtp-relay.brevo.com:465
          - key: SMTP_URL
            sync: false
          - key: MAIL_FROM # a sender address verified at the mail provider
            sync: false
          - key: APP_URL # address of the website, the links in the mails point there
            sync: false
