name: CI/CD

# Every push and pull request is checked. A push to the main branch is deployed to Render
# after all checks are green. Make the "Build, lint and test" and "Dependency scan" checks
# required in the branch protection rule, so a red pipeline blocks the merge.
on:
    pull_request:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# bash with pipefail, so a failing test run still fails the step when its output goes through tee.
defaults:
    run:
        shell: bash

env:
    IMAGE_NAME: smart-reading-coach-api

jobs:
    check:
        name: Build, lint and test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Unit tests with coverage
              run: npm run test:ci | tee test-output.txt

            - name: Test report in the run summary
              if: always()
              run: |
                  {
                      echo '### Test results'
                      echo '```'
                      grep -E '^ℹ (tests|suites|pass|fail|skipped) ' test-output.txt || true
                      echo '```'
                      echo '### Coverage'
                      echo '```'
                      sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt || true
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Keep the test report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: test-results.xml
                  if-no-files-found: ignore

            - name: Build
              run: npm run build

            # Catches a broken Dockerfile in a pull request, before it reaches the main branch.
            - name: Build the Docker image
              run: docker build --tag "$IMAGE_NAME:check" .

    security:
        name: Dependency scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # Fails the pipeline on a known high or critical vulnerability (all dependencies).
            # The scan reads package-lock.json, so nothing has to be installed.
            - name: npm audit
              run: npm audit --audit-level=high

    deploy:
        name: Deploy to Render
        needs: [check, security]
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        runs-on: ubuntu-latest
        environment: production
        env:
            # Secret URL of the deploy hook of the Render service (Render: Settings > Deploy Hook).
            DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
            # Render API key (Account settings > API Keys), only used to read the status of the deploy.
            RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
            API_URL: ${{ vars.API_URL }}
        steps:
            # Auto deploy is switched off in render.yaml, so Render only deploys what this pipeline
            # has checked. The deploy hook starts a deploy of exactly this commit.
            - name: Start the deploy
              run: |
                  RESPONSE=$(curl --fail --silent --show-error --request POST \
                      "${DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
                  echo "$RESPONSE"
                  echo "DEPLOY_ID=$(echo "$RESPONSE" | jq --raw-output '.deploy.id')" >> "$GITHUB_ENV"
                  # The service id is part of the hook URL: https://api.render.com/deploy/srv-xxxx?key=...
                  echo "SERVICE_ID=$(echo "$DEPLOY_HOOK_URL" | sed -E 's#.*/deploy/(srv-[^?]+).*#\1#')" >> "$GITHUB_ENV"

            # Wait until Render says the new version is live (or the build failed).
            - name: Wait for the deploy
              run: |
                  for attempt in $(seq 1 60); do
                      STATUS=$(curl --fail --silent --show-error \
                          --header "Authorization: Bearer $RENDER_API_KEY" \
                          "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
                          | jq --raw-output '.status')
                      echo "Deploy status: $STATUS"
                      case "$STATUS" in
                          live) exit 0 ;;
                          build_failed | update_failed | pre_deploy_failed | canceled | deactivated) exit 1 ;;
                      esac
                      sleep 15
                  done
                  echo "The deploy took longer than 15 minutes" && exit 1

            # The health route checks both databases. A free service may need a minute to wake up.
            - name: Smoke test
              run: |
                  echo "Checking ${API_URL}/api/health"
                  curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
                      --output /dev/null "${API_URL}/api/health"
