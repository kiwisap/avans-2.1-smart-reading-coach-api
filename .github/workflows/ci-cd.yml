name: CI/CD

# Every push and pull request is checked. A push to the main branch is deployed to Azure
# after all checks are green. Make the "Build, lint and test" and "Dependency scan" checks
# required in the branch protection rule, so a red pipeline blocks the merge.
on:
    pull_request:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# bash with pipefail, so a failing test run still fails the step when its output goes through tee.
defaults:
    run:
        shell: bash

env:
    IMAGE_NAME: smart-reading-coach-api

jobs:
    check:
        name: Build, lint and test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Unit tests with coverage
              run: npm run test:ci | tee test-output.txt

            - name: Test report in the run summary
              if: always()
              run: |
                  {
                      echo '### Test results'
                      echo '```'
                      grep -E '^ℹ (tests|suites|pass|fail|skipped) ' test-output.txt || true
                      echo '```'
                      echo '### Coverage'
                      echo '```'
                      sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt || true
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Keep the test report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: test-results.xml
                  if-no-files-found: ignore

            - name: Build
              run: npm run build

            # Catches a broken Dockerfile in a pull request, before it reaches the main branch.
            - name: Build the Docker image
              run: docker build --tag "$IMAGE_NAME:check" .

    security:
        name: Dependency scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # Fails the pipeline on a known high or critical vulnerability (all dependencies).
            # The scan reads package-lock.json, so nothing has to be installed.
            - name: npm audit
              run: npm audit --audit-level=high

    deploy:
        name: Deploy to Azure
        needs: [check, security]
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        runs-on: ubuntu-latest
        environment: production
        permissions:
            id-token: write # lets the job sign in to Azure without a stored password
            contents: read
        env:
            ACR_NAME: ${{ vars.ACR_NAME }}
            RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
            APP_NAME: ${{ vars.API_APP_NAME }}
        steps:
            - uses: actions/checkout@v4

            - name: Sign in to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Sign in to the container registry
              run: az acr login --name "$ACR_NAME"

            - name: Build and push the image
              run: |
                  IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"
                  docker build --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
                  docker push "$IMAGE:${{ github.sha }}"
                  docker push "$IMAGE:latest"

            # The image tag is the commit, so every revision can be traced to its code.
            - name: Deploy the new revision
              run: |
                  az containerapp update \
                      --name "$APP_NAME" \
                      --resource-group "$RESOURCE_GROUP" \
                      --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

            # The health route checks both databases. The app may need a moment to start,
            # because the container applies migrations first (and can scale from zero).
            - name: Smoke test
              run: |
                  FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                      --query properties.configuration.ingress.fqdn --output tsv)
                  echo "Checking https://$FQDN/api/health"
                  curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
                      "https://$FQDN/api/health"
